# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  definitions:
    - tbb: ["intel-tbb"]
      when: '"darwin" in platform'
    - tbb: [ "intel-oneapi-tbb" ]
      when: '"linux" in platform'
  specs:
    - "boost@1.85.0: +system+filesystem+date_time+thread+chrono+regex+iostreams+program_options+mpi+serialization~python"
    - "cgal@6: +gmp"
    - "hdf5 +cxx"
    - "netcdf-c@4.9.0: +mpi"
    - "netcdf-cxx4@4.3:"
    - "gdal@3.8: +hdf5 +netcdf"
    - "proj@9: +curl+tiff"
    - "sparsehash"
    - "gperftools build_system=autotools"
    - "gsl +external-cblas"
    - "armadillo"
    - "tbb"
    - "eigen"
    - "meteoio"
    - "func@2.2.0: ~openmp"
    - "trilinos@15: +mpi"
    - "jemalloc"
    - "spdlog"
    - "openblas"
    - "cmake@3.30:"
    - "openmpi"
    - "vtk@9.3:"
    - "googletest"
    # - "gcc@14"
  #  - udunits
  view:
    default:
      root: .spack-env/view
      projections:
        all: '{name}/{version}-{compiler.name}'
  concretizer:
    unify: true
